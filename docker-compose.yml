services:
  taxi-app:
    build:
      context: .

    container_name: taxi-app

    restart: unless-stopped

    environment:
      NODE_ENV: production
      TZ: Europe/Warsaw
      DB_HOST: taxi-mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}

    volumes:
      - ./src:/app/src
      - ./frontend:/app/frontend
      - ./uploads:/app/uploads
      - ./public:/app/public

#    expose:
#      - "3000"
    ports:
      - "3000:3000"

    depends_on:
      taxi-mysql:
        condition: service_healthy

  taxi-mysql:

    image: mysql:8.4
    container_name: taxi-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}


    volumes:
      - taxi_mysql_data:/var/lib/mysql


    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost"
        ]

      interval: 10s
      timeout: 5s
      retries: 10



