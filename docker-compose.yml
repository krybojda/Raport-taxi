services:
  taxi-app:
    build:
      context: .

    container_name: taxi-app

    restart: unless-stopped

    environment:
      NODE_ENV: production
      TZ: Europe/Warsaw
      DB_HOST: taxi-mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}

    volumes:
      - ./src:/app/src
      - ./uploads:/app/uploads
      - ./public:/app/public

#    expose:
#      - "3000"
    ports:
      - "3000:3000"

    depends_on:
      taxi-mysql:
        condition: service_healthy

  taxi-mysql:

    image: mysql:8.4
    container_name: taxi-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}


    volumes:
      - taxi_mysql_data:/var/lib/mysql


    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost"
        ]

      interval: 10s
      timeout: 5s
      retries: 10



  taxi-backup:

    image: offen/docker-volume-backup
    container_name: taxi-backup
    restart: unless-stopped
    environment:
      TZ: Europe/Warsaw
      BACKUP_CRON_EXPRESSION: "0 4 * * *"
      BACKUP_FILENAME: "taxi-%Y-%m-%d-%H-%M.tar.gz"
      BACKUP_RETENTION_DAYS: "14"

    volumes:
       # MySQL
    - taxi_mysql_data:/backup/mysql:ro

    # Uploads
    - ./uploads:/backup/uploads:ro

    # Kod aplikacji
    - ./src:/backup/src:ro
    - ./public:/backup/public:ro

    # Konfiguracja Dockera
    - ./docker-compose.yml:/backup/docker/docker-compose.yml:ro
    - ./Dockerfile:/backup/docker/Dockerfile:ro

    # Gdzie zapisać archiwum
    - ./backups:/archive

    # Nginx
    - /etc/nginx/sites-enabled/vps-dashboard:/backup/nginx/vps-dashboard:ro



volumes:
  taxi_mysql_data:
