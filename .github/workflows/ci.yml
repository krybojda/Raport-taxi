name: Taxi CI - Develop

on:
  push:
    branches:
      - dev

  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4

        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -p${MYSQL_ROOT_PASSWORD}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      # Pobranie repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # Build Docker image
      - name: Build Docker image
        run: docker build -t taxi-app .

      # Utworzenie testowego użytkownika
      - name: Create test user
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: ${{ secrets.MYSQL_DATABASE }}
          DB_USER: ${{ secrets.MYSQL_USER }}
          DB_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}

        run: |
          docker run --rm --network host \
            -e DB_HOST=127.0.0.1 \
            -e DB_PORT=3306 \
            -e DB_NAME="${{ secrets.MYSQL_DATABASE }}" \
            -e DB_USER="${{ secrets.MYSQL_USER }}" \
            -e DB_PASSWORD="${{ secrets.MYSQL_PASSWORD }}" \
            taxi-app node src/createTestUser.js

      # ESLint
      - name: ESLint
        run: docker run --rm taxi-app npm run lint

      # Sprawdzenie formatowania
      - name: Check formatting
        run: docker run --rm taxi-app npm run format

      # Validate docker-compose
      - name: Validate docker-compose
        run: |
          docker compose config

      # Sprawdzenie składni JS
      - name: Check JavaScript syntax
        run: docker run --rm taxi-app node --check src/server.js

      # Start aplikacji
      - name: Start application
        env:
          NODE_ENV: test
          PORT: 3000

          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: ${{ secrets.MYSQL_DATABASE }}
          DB_USER: ${{ secrets.MYSQL_USER }}
          DB_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

        run: |
          docker run -d --name taxi-app-ci --network host \
            -e NODE_ENV=test \
            -e PORT=3000 \
            -e DB_HOST=127.0.0.1 \
            -e DB_PORT=3306 \
            -e DB_NAME="${{ secrets.MYSQL_DATABASE }}" \
            -e DB_USER="${{ secrets.MYSQL_USER }}" \
            -e DB_PASSWORD="${{ secrets.MYSQL_PASSWORD }}" \
            -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            taxi-app npm start

          for attempt in {1..30}; do
            if curl --silent --fail http://localhost:3000/api/status > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          docker logs taxi-app-ci
          exit 1

      # Test API status
      - name: Check API endpoint
        run: |
          curl --fail http://localhost:3000/api/status

      # Test bazy danych
      - name: Check database connection
        run: |
          curl --fail http://localhost:3000/api/database

      # Test logowania
      - name: Test login
        run: |
          curl --fail \
            -c cookies.txt \
            -X POST \
            http://localhost:3000/api/auth/login \
            -H "Content-Type: application/json" \
            --data '{"name":"CI Test User","password":"CI_Test_Password_123!"}'

      # Test zalogowanego użytkownika
      - name: Test authenticated user
        run: |
          curl --fail \
            -b cookies.txt \
            http://localhost:3000/api/auth/me

      # Test wylogowania
      - name: Test logout
        run: |
          curl --fail \
            -b cookies.txt \
            -c cookies.txt \
            -X POST \
            http://localhost:3000/api/auth/logout

      # Zamknięcie aplikacji
      - name: Stop application
        if: always()
        run: docker rm --force taxi-app-ci || true
